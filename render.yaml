services:
  - type: web
    name: repolens-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: EMBEDDING_PROVIDER
        value: local
      - key: DATA_DIR
        value: /app/data
      - key: REPOLENS_ACCESS_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: LLM_API_KEY
        sync: false
