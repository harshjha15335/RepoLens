<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="boxBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="boxIndigo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="boxEmerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="boxAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="1040" height="50" rx="8" fill="url(#gradHeader)"/>
  <text x="550" y="52" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="0.5">
    CODEMENTOR-RAG: CODEBASE INGESTION &amp; HYBRID PROCESSING PIPELINE
  </text>

  <!-- STAGE 1: INGESTION & VALIDATION -->
  <g transform="translate(40, 100)">
    <rect width="210" height="420" rx="8" fill="url(#boxBlue)" stroke="#0284c7" stroke-width="1.8" filter="url(#shadow)"/>
    <rect width="210" height="38" rx="8" fill="#0284c7"/>
    <text x="105" y="24" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">STAGE 1: INGESTION</text>
    
    <!-- Sub-boxes -->
    <rect x="15" y="55" width="180" height="65" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="1.2"/>
    <text x="25" y="78" fill="#0369a1" font-size="12" font-weight="700">Codebase Sources</text>
    <text x="25" y="96" fill="#475569" font-size="10.5">• Git Clone (GitHub / GitLab)</text>
    <text x="25" y="111" fill="#475569" font-size="10.5">• Local ZIP Archive Upload</text>

    <rect x="15" y="135" width="180" height="75" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="1.2"/>
    <text x="25" y="158" fill="#0369a1" font-size="12" font-weight="700">Security &amp; Hygiene Filter</text>
    <text x="25" y="176" fill="#475569" font-size="10.5">• Exclusion (.git, venv, pycache)</text>
    <text x="25" y="191" fill="#475569" font-size="10.5">• Binary &amp; Asset Filtering</text>
    <text x="25" y="204" fill="#475569" font-size="10.5">• Max File Size Enforcer (&lt;500KB)</text>

    <rect x="15" y="225" width="180" height="85" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="1.2"/>
    <text x="25" y="248" fill="#0369a1" font-size="12" font-weight="700">Language Detection</text>
    <text x="25" y="266" fill="#475569" font-size="10.5">• Python (.py)</text>
    <text x="25" y="281" fill="#475569" font-size="10.5">• JavaScript / TypeScript (.js, .ts)</text>
    <text x="25" y="296" fill="#475569" font-size="10.5">• Markup / Docs (.md, .json)</text>

    <rect x="15" y="325" width="180" height="75" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="1.2"/>
    <text x="25" y="348" fill="#0369a1" font-size="12" font-weight="700">Storage Manifest</text>
    <text x="25" y="366" fill="#475569" font-size="10.5">• UTF-8 Normalized Buffer</text>
    <text x="25" y="381" fill="#475569" font-size="10.5">• Relative Path Indexing</text>
    <text x="25" y="394" fill="#475569" font-size="10.5">• Repo Metadata Persistence</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="250" y1="310" x2="300" y2="310" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STAGE 2: PARSING & AST EXTRACTION -->
  <g transform="translate(305, 100)">
    <rect width="225" height="420" rx="8" fill="url(#boxIndigo)" stroke="#4f46e5" stroke-width="1.8" filter="url(#shadow)"/>
    <rect width="225" height="38" rx="8" fill="#4f46e5"/>
    <text x="112" y="24" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">STAGE 2: AST &amp; SYMBOLS</text>
    
    <rect x="15" y="55" width="195" height="80" rx="6" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.2"/>
    <text x="25" y="78" fill="#4338ca" font-size="12" font-weight="700">AST Parsing Engine</text>
    <text x="25" y="96" fill="#475569" font-size="10.5">• Python Native `ast` Parser</text>
    <text x="25" y="111" fill="#475569" font-size="10.5">• Tree-Sitter Polyglot Parser</text>
    <text x="25" y="126" fill="#475569" font-size="10.5">• Syntax Tree Error Recovery</text>

    <rect x="15" y="150" width="195" height="85" rx="6" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.2"/>
    <text x="25" y="173" fill="#4338ca" font-size="12" font-weight="700">Symbol Extraction</text>
    <text x="25" y="191" fill="#475569" font-size="10.5">• Classes, Functions, Methods</text>
    <text x="25" y="206" fill="#475569" font-size="10.5">• Imports &amp; Module Dependencies</text>
    <text x="25" y="221" fill="#475569" font-size="10.5">• Line Spans: start_line, end_line</text>

    <rect x="15" y="250" width="195" height="75" rx="6" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.2"/>
    <text x="25" y="273" fill="#4338ca" font-size="12" font-weight="700">Docstring &amp; Signature</text>
    <text x="25" y="291" fill="#475569" font-size="10.5">• Argument &amp; Return Type Inspec</text>
    <text x="25" y="306" fill="#475569" font-size="10.5">• Structured Docstring Extraction</text>
    <text x="25" y="319" fill="#475569" font-size="10.5">• Cyclomatic Complexity Analysis</text>

    <rect x="15" y="340" width="195" height="65" rx="6" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.2"/>
    <text x="25" y="363" fill="#4338ca" font-size="12" font-weight="700">Relational Mapping</text>
    <text x="25" y="381" fill="#475569" font-size="10.5">• Inheritance (`INHERITS`)</text>
    <text x="25" y="396" fill="#475569" font-size="10.5">• Call References (`CALLS`)</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="530" y1="310" x2="575" y2="310" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STAGE 3: CHUNKING & GRAPH CONSTRUCTION -->
  <g transform="translate(580, 100)">
    <rect width="235" height="420" rx="8" fill="url(#boxEmerald)" stroke="#059669" stroke-width="1.8" filter="url(#shadow)"/>
    <rect width="235" height="38" rx="8" fill="#059669"/>
    <text x="117" y="24" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">STAGE 3: CHUNKING &amp; GRAPH</text>

    <rect x="15" y="55" width="205" height="95" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
    <text x="25" y="78" fill="#047857" font-size="12" font-weight="700">AST-Aware Semantic Chunking</text>
    <text x="25" y="96" fill="#475569" font-size="10.5">• Cohesive Unit Boundary Preserv.</text>
    <text x="25" y="111" fill="#475569" font-size="10.5">• Header Decorator: File + Class</text>
    <text x="25" y="126" fill="#475569" font-size="10.5">• Token Budget: 400 - 800 tokens</text>
    <text x="25" y="141" fill="#475569" font-size="10.5">• Sliding Overlap: 50 tokens fallback</text>

    <rect x="15" y="165" width="205" height="110" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
    <text x="25" y="188" fill="#047857" font-size="12" font-weight="700">Code Knowledge Graph Build</text>
    <text x="25" y="206" fill="#475569" font-size="10.5">• Nodes: Files, Classes, Functions</text>
    <text x="25" y="221" fill="#475569" font-size="10.5">• Edges: CALLS, IMPORTS, CONTAINS</text>
    <text x="25" y="236" fill="#475569" font-size="10.5">• Multi-DiGraph via NetworkX</text>
    <text x="25" y="251" fill="#475569" font-size="10.5">• Centrality &amp; Degree Scoring</text>
    <text x="25" y="266" fill="#475569" font-size="10.5">• JSON Topology Serialization</text>

    <rect x="15" y="290" width="205" height="110" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
    <text x="25" y="313" fill="#047857" font-size="12" font-weight="700">Chunk Enrichment</text>
    <text x="25" y="331" fill="#475569" font-size="10.5">• Breadcrumb Path Injection</text>
    <text x="25" y="346" fill="#475569" font-size="10.5">• AST Symbol Scope Binding</text>
    <text x="25" y="361" fill="#475569" font-size="10.5">• Import Dependency Injection</text>
    <text x="25" y="376" fill="#475569" font-size="10.5">• Lexical Tokenization for BM25</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="815" y1="310" x2="855" y2="310" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STAGE 4: EMBEDDING & INDEXING -->
  <g transform="translate(860, 100)">
    <rect width="200" height="420" rx="8" fill="url(#boxAmber)" stroke="#d97706" stroke-width="1.8" filter="url(#shadow)"/>
    <rect width="200" height="38" rx="8" fill="#d97706"/>
    <text x="100" y="24" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">STAGE 4: INDEX STORAGE</text>

    <rect x="15" y="55" width="170" height="90" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1.2"/>
    <text x="25" y="78" fill="#b45309" font-size="12" font-weight="700">Dense Embedding</text>
    <text x="25" y="96" fill="#475569" font-size="10.5">• `all-MiniLM-L6-v2`</text>
    <text x="25" y="111" fill="#475569" font-size="10.5">• 384-Dimensional Vectors</text>
    <text x="25" y="126" fill="#475569" font-size="10.5">• L2 Unit Normalization</text>
    <text x="25" y="139" fill="#475569" font-size="10.5">• Batch Encoded on PyTorch</text>

    <rect x="15" y="160" width="170" height="75" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1.2"/>
    <text x="25" y="183" fill="#b45309" font-size="12" font-weight="700">FAISS Vector Index</text>
    <text x="25" y="201" fill="#475569" font-size="10.5">• IndexFlatIP (Inner Product)</text>
    <text x="25" y="216" fill="#475569" font-size="10.5">• Exact Cosine Distance</text>
    <text x="25" y="229" fill="#475569" font-size="10.5">• In-Memory &amp; MMap Cache</text>

    <rect x="15" y="250" width="170" height="75" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1.2"/>
    <text x="25" y="273" fill="#b45309" font-size="12" font-weight="700">BM25 Okapi Index</text>
    <text x="25" y="291" fill="#475569" font-size="10.5">• Rank-BM25 Lexical Store</text>
    <text x="25" y="306" fill="#475569" font-size="10.5">• Snake_case &amp; camelCase</text>
    <text x="25" y="319" fill="#475569" font-size="10.5">• Sub-token Keyword Matches</text>

    <rect x="15" y="340" width="170" height="65" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1.2"/>
    <text x="25" y="363" fill="#b45309" font-size="12" font-weight="700">SQLite Database</text>
    <text x="25" y="381" fill="#475569" font-size="10.5">• Chunk Records &amp; Hashes</text>
    <text x="25" y="396" fill="#475569" font-size="10.5">• Symbol Table &amp; Calls</text>
  </g>

  <!-- Bottom Legend Bar -->
  <rect x="40" y="535" width="1020" height="30" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="550" y="555" fill="#64748b" font-size="11" text-anchor="middle">
    Pipeline throughput: ~850 lines/sec AST parsing | Dense embedding: &lt;1.8s for 42 chunks on CPU | Dual-index synchronicity maintained via SQLite ACID transactions
  </text>
</svg>
