services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - codementor-data:/app/data
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - DATA_DIR=/app/data
      - REPOLENS_ACCESS_KEY=${REPOLENS_ACCESS_KEY:?Set REPOLENS_ACCESS_KEY in the environment}
      - DATABASE_URL=sqlite+aiosqlite:////app/data/codementor.db
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-local}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - LLM_PROVIDER=ollama
      - LLM_MODEL=llama3.1:8b
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_BASE_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  codementor-data:
  ollama-data:
